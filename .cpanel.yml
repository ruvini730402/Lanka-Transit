---
# Lanka Transit - Git-based cPanel Deployment
# This runs automatically when you push to the repository

deployment:
  tasks:
    # Set deployment path
    - export DEPLOYPATH=/home/anagatha/public_html/transit.uvacell.com
    
    # Create deployment directory if it doesn't exist
    - /bin/mkdir -p $DEPLOYPATH
    
    # Copy files (excluding development files)
    - /bin/cp -R * $DEPLOYPATH/
    
    # Remove development files from production
    - /bin/rm -rf $DEPLOYPATH/.git
    - /bin/rm -rf $DEPLOYPATH/tests
    - /bin/rm -rf $DEPLOYPATH/tmp
    - /bin/rm -f $DEPLOYPATH/.gitignore
    - /bin/rm -f $DEPLOYPATH/.cpanel.yml
    - /bin/rm -f $DEPLOYPATH/README.md
    - /bin/rm -f $DEPLOYPATH/session_debug.php
    - /bin/rm -f $DEPLOYPATH/payment_debug.php
    - /bin/rm -f $DEPLOYPATH/test_*.php
    
    # Create production environment file (copy dev .env and override production values)
    - /bin/cp .env $DEPLOYPATH/.env
    
    
    
    # Set file permissions for security
    #- /bin/find $DEPLOYPATH -type f -name "*.php" -exec chmod 644 {} \;
    #- /bin/find $DEPLOYPATH -type d -exec chmod 755 {} \;
    - /bin/chmod 600 $DEPLOYPATH/.env
    - /bin/chmod 644 $DEPLOYPATH/config/*.example.php
    
    # Create deployment timestamp
    - echo "Last deployed: $(date)" > $DEPLOYPATH/deployment.log
    - echo "Deployed from commit: $(/bin/git rev-parse HEAD 2>/dev/null || echo 'unknown')" >> $DEPLOYPATH/deployment.log