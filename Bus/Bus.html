<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bus Seat Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">



</head>
<body class="bg-light">

  <div class="container my-4">
    <h2 class="text-center mb-4">Select Seats & Fill Form</h2>

    <div class="row">
      <!-- Seat Map Section -->
      <div class="col-md-7 mb-4">
        <div id="seat-map"></div>

        <!-- Legend -->
        <div class="mt-4">
          <h6>Legend:</h6>
          <div class="d-flex flex-column">
            <div class="d-flex align-items-center mb-1">
              <span class="d-inline-block rounded me-2" style="width:20px; height:20px; background:#90ee90;"></span> Available
            </div>
            <div class="d-flex align-items-center mb-1">
              <span class="d-inline-block rounded me-2" style="width:20px; height:20px; background:#ffb6c1;"></span> Booked (Female)
            </div>
            <div class="d-flex align-items-center mb-1">
              <span class="d-inline-block rounded me-2" style="width:20px; height:20px; background:#add8e6;"></span> Booked (Male)
            </div>
            <div class="d-flex align-items-center mb-1">
              <span class="d-inline-block rounded me-2" style="width:20px; height:20px; background:#d3d3d3;"></span> Booked (Undisclosed)
            </div>
            <div class="d-flex align-items-center mb-1">
              <span class="d-inline-block rounded me-2" style="width:20px; height:20px; background:orange;"></span> Selected
            </div>
          </div>
        </div>
      </div>

      <!-- Booking Form -->
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-3">Passenger Info</h5>
            <form id="booking-form">
              <div class="mb-3">
                <label class="form-label">Passenger Name</label>
                <input type="text" class="form-control" name="name" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Mobile Number</label>
                <input type="tel" class="form-control" name="phone" required>
              </div>

              <div class="mb-3">
                <label class="form-label">NIC (Optional)</label>
                <input type="text" class="form-control" name="nic">
              </div>

              <div class="mb-3">
                <label class="form-label">Gender</label>
                <select class="form-select" name="gender" id="gender" required>
                  <option value="">Select</option>
                  <option value="female">Female</option>
                  <option value="male">Male</option>
                  <option value="undisclosed">Undisclosed</option>
                </select>
              </div>

              <input type="hidden" name="seat" id="selected-seat">
              <button type="submit" class="btn btn-success w-100">Book Seat</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

 <script src="Bus.js"></script>
</body>
</html>
